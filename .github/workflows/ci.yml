name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:                       # job 名即任务 3 中要选择的必需检查名称
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      
      # TODO 1：用 actions/setup-go 安装 Go，go-version 写 1.26.9
      - name: Setup Go
        id: setup_go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: go.mod

      - name: Show Go cache result
        env:
          CACHE_HIT: ${{ steps.setup_go.outputs.cache-hit }}
        run: echo "cache-hit=$CACHE_HIT"

      # TODO 2：添加一个 step，打印上下文
      # 按提示要求：先放入 env，再在脚本中以环境变量引用
      - name: Print GitHub context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "github.event_name: $EVENT_NAME"
          echo "github.ref: $REF"
          echo "github.sha: $SHA"
          echo "github.event.pull_request.head.sha: $PR_HEAD_SHA"

      # TODO 3：make fmt-check、make vet、make test 各占一个 step
      - name: make fmt-check
        run: make fmt-check

      - name: make vet
        run: make vet

      - name: make test
        run: make test

      # TODO 4：只在 push 到 main 时执行打包
      - name: make package
        if: github.event_name == 'push'
        env:
          VERSION: 0.0.0-main
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package
          # 用 sha256sum 打印二进制文件和 tar.gz 的校验和
          # 注意：这里精确指定文件，千万不要用 `sha256sum dist/*`，否则遇到目录会报错
          sha256sum dist/*.tar.gz
          sha256sum dist/*/enroll-conflict

      # 用 actions/upload-artifact 上传文件
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          # artifact 名称中包含提交号和构建号
          name: artifact-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
