name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release gate
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit is not in main history"
            exit 1
          fi
          echo "Release gate passed: $GITHUB_SHA is in main history"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build package and print checksums
        shell: bash
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT"

          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64/enroll-conflict"
          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64.tar.gz"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes