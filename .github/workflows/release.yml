name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release gate
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit is not in main history"
            exit 1
          fi
          echo "Release gate passed: $GITHUB_SHA is in main history"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build package and print checksums
        shell: bash
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT"

          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64/enroll-conflict"
          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64.tar.gz"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
  container:
    name: Build and publish container
    needs: release
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download and verify Release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="enroll-conflict_${VERSION}_linux_amd64"

          mkdir -p downloads image-context

          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${PACKAGE}.tar.gz" \
            --pattern "${PACKAGE}.tar.gz.sha256" \
            --dir downloads

          (
            cd downloads
            sha256sum -c "${PACKAGE}.tar.gz.sha256"
          )

          tar -xzf "downloads/${PACKAGE}.tar.gz" -C image-context
          cat "image-context/${PACKAGE}/BUILD_INFO"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=image-context/$PACKAGE" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GH_USER" \
              --password-stdin

      - name: Build image from Release package
        shell: bash
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            "$PACKAGE_DIR"

      - name: Push image and record digest
        shell: bash
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker pull --platform linux/amd64 "$IMAGE:$GITHUB_REF_NAME"

          IMAGE_REF=$(docker image inspect \
            "$IMAGE:$GITHUB_REF_NAME" \
            --format '{{index .RepoDigests 0}}')

          echo "Image reference: $IMAGE_REF"

          {
            echo "### Container image"
            echo
            echo "- Tag: $IMAGE:$GITHUB_REF_NAME"
            echo "- Digest reference: $IMAGE_REF"
            echo "- Platform: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"